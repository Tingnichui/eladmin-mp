server:
  port: 11280
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

mybatis-plus:
  configuration:
    # 关闭二级缓存
    cache-enabled: false
    # 设置本地缓存作用域
    local-cache-scope: SESSION

spring:
  freemarker:
    check-template-location: false
  profiles:
    # 激活的环境，如果需要 quartz 分布式支持，需要修改 active: dev,quartz
    active: dev
  main:
    allow-circular-references: true
  data:
    redis:
      repositories:
        enabled: false
#  pid:
#    file: /自行指定位置/eladmin.pid

task:
  pool:
    # 核心线程池大小
    core-pool-size: 10
    # 最大线程数
    max-pool-size: 30
    # 活跃时间
    keep-alive-seconds: 60
    # 队列容量
    queue-capacity: 50

#七牛云
qiniu:
  # 文件大小 /M
  max-size: 15

#邮箱验证码有效时间/秒
code:
  expiration: 300

#密码加密传输，前端公钥加密，后端私钥解密
rsa:
  private_key: 

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}

data:
  # 数据加密，数据库公钥加密，业务中私钥解密
  rsa:
    public_key: ENC()
    private_key: ENC()

# 币安密钥
binance:
  spot:
    api_host: https://api.binance.com
  usd_futures:
    api_host: https://fapi.binance.com
  coin_futures:
    api_host: https://dapi.binance.com

